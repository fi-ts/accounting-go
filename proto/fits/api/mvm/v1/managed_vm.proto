syntax = "proto3";

package fits.api.mvm.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "metalstack/io/accounting/api/v1/common.proto";

option go_package = "pkg/apis/mvm/v1";

service ManagedVMService {
  rpc Added(ManagedVMReport) returns (metalstack.io.accounting.api.v1.Empty);
  rpc Modified(ManagedVMReport) returns (metalstack.io.accounting.api.v1.Empty);
  rpc Deleted(ManagedVMReport) returns (metalstack.io.accounting.api.v1.Empty);

  rpc Usage(ManagedVMUsageRequest) returns (ManagedVMUsageResponse);
}

message ManagedVMReport {
  string tenant = 1;
  string projectid = 2;
  string requestid = 3;
  google.protobuf.Timestamp timestamp = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
  ManagedVM vm = 7;
  repeated string annotations = 8;
}

message ManagedVM {
  string uuid = 1;
  string hostname = 2;
  string fqdn = 3;
  string cpus = 4;
  string memory = 5;
  string image = 6;
  string serviceclass = 7;
  string availability = 8;
  repeated ManagedVMVolume volumes = 9;
}

message ManagedVMVolume {
  string uuid = 1;
  string name = 2;
  string storage_type = 3;
  uint64 size = 4;
}

message ManagedVMUsageRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  optional string tenant = 3;
  optional string projectid = 4;
  repeated string annotations = 5;
}

message ManagedVMUsageResponse {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  repeated ManagedVMUsage usage = 3;
  ManagedVMUsageAccumuluated accumulated_usage = 4;
}

message ManagedVMUsage {
  string tenant = 1;
  string project_id = 2;
  string project_name = 3;
  string request_id = 4;
  string vm_uuid = 5;
  string hostname = 6;
  string fqdn = 7;
  google.protobuf.Timestamp vm_start = 8;
  google.protobuf.Timestamp vm_end = 9;
  google.protobuf.Duration lifetime = 10;
  repeated ManagedVMVolume volumes = 13;
  repeated string warnings = 11;
  repeated string annotations = 12;
}

message ManagedVMUsageAccumuluated {
  google.protobuf.Duration lifetime = 1;
}
